server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Source maps carry the full application source. The image build deletes them, so
    # there is nothing here to serve; this answers 404 rather than letting the
    # single-page fallback return index.html with a 200.
    location ~ \.map$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # `^~` on both proxies, so the regex location never takes a proxied request.
    location ^~ /api/ {
        proxy_pass http://server:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ws {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
