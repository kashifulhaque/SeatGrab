services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      SEATGRAB_HOST: 0.0.0.0
      SEATGRAB_PORT: "8787"
      SEATGRAB_DB_PATH: /data/seatgrab.db
      SEATGRAB_ALLOWED_ORIGINS: ${SEATGRAB_ALLOWED_ORIGINS:-https://seatgrab.ifkash.dev}
    volumes:
      - server-data:/data
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: seatgrab-web
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - default
      - edge

volumes:
  server-data:

networks:
  default:
  edge:
    external: true
