services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      GERRYMANDER_HOST: 0.0.0.0
      GERRYMANDER_PORT: "8787"
      GERRYMANDER_DB_PATH: /data/gerrymander.db
      GERRYMANDER_ALLOWED_ORIGINS: ${GERRYMANDER_ALLOWED_ORIGINS:-https://gerrymander.ifkash.dev}
    volumes:
      - server-data:/data
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gerrymander-web
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - default
      - edge

volumes:
  server-data:

networks:
  default:
  edge:
    external: true
